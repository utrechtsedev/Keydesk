name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keydesk
          POSTGRES_PASSWORD: keydesk
          POSTGRES_DB: keydesk
        # Same host port as compose.yaml, so .env.test works unchanged
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mail:
        image: greenmail/standalone:2.1.14
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        # Same host ports as compose.yaml
        ports:
          - 53025:3025
          - 53143:3143

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check && bun run check:mail

      - name: Build
        run: bun run build && bun run build:mail

      - name: Test against the dev server
        run: bun run test

      - name: Test against the built app in workerd
        run: bun run test
        env:
          TEST_APP: build
