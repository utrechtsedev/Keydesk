services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keydesk
      POSTGRES_PASSWORD: keydesk
      POSTGRES_DB: keydesk
    ports:
      - '5433:5432'
    volumes:
      - db:/var/lib/postgresql/data

  # A test mail server for mailboxes: it accepts any user and password, and keeps mail in memory
  mail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports:
      - '53025:3025' # SMTP
      - '53143:3143' # IMAP

volumes:
  db:
